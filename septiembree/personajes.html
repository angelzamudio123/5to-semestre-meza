<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes Ilustres</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Lienzo estilo diapositiva */
        .slide-container {
            width: 1000px;
            height: 562px; /* Proporción 16:9 */
            background-color: #ffffff;
            display: flex;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* Contenido principal */
        .main-content {
            flex: 1;
            padding: 20px 25px 20px 25px;
            display: flex;
            flex-direction: column;
        }

        /* Título */
        h1 {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 2rem;
            font-weight: normal;
            color: #111;
            margin-bottom: 15px;
        }

        /* Rejilla de personajes (4 columnas x 2 filas) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
        }

        /* Tarjeta individual de personaje */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #f9f9f9;
        }

        /* Contenedor de la imagen */
        .img-box {
            width: 100%;
            height: 190px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /* Etiqueta del nombre */
        .name {
            width: 100%;
            background-color: #ffffff;
            text-align: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #000;
            padding: 4px 2px;
            text-transform: uppercase;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.5px;
            border-top: 1px solid #ddd;
        }

        /* Franja verde lateral */
        .sidebar-green {
            width: 100px;
            background-color: #008744;
            height: 100%;
        }

        /* Ajustes responsivos para pantallas pequeñas */
        @media (max-width: 900px) {
            .slide-container {
                width: 100%;
                height: auto;
                flex-direction: column;
            }
            .sidebar-green {
                width: 100%;
                height: 30px;
            }
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="slide-container">
        
        <!-- Área principal de contenido -->
        <div class="main-content">
            <h1>Personajes ilustres</h1>

            <div class="grid-container">
                
                <!-- 1. Miguel Hidalgo -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Miguel_Hidalgo_retrato.png/496px-Miguel_Hidalgo_retrato.png" alt="Miguel Hidalgo y Costilla">
                    </div>
                    <div class="name">MIGUEL HIDALGO Y COSTILLA</div>
                </div>

                <!-- 2. José María Morelos -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Retrato_de_Morelos%2C_1813.png/500px-Retrato_de_Morelos%2C_1813.png" alt="Jose Maria Morelos y Pavon">
                    </div>
                    <div class="name">JOSE MARIA MORELOS Y PAVON</div>
                </div>

                <!-- 3. Benito Juárez -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Retrato_de_Benito_Ju%C3%A1rez%2C_1861-1862.png/424px-Retrato_de_Benito_Ju%C3%A1rez%2C_1861-1862.png" alt="Benito Juarez">
                    </div>
                    <div class="name">BENITO JUAREZ</div>
                </div>

                <!-- 4. Josefa Ortiz de Domínguez -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Josefa_Ortiz%2C_%C3%B3leo_sobre_tela.jpg/500px-Josefa_Ortiz%2C_%C3%B3leo_sobre_tela.jpg" alt="Josefa Ortiz de Dominguez">
                    </div>
                    <div class="name">JOSEFA ORTIZ DE DOMINGUEZ</div>
                </div>

                <!-- 5. Vicente Guerrero -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/General_Vicente_Guerrero.jpg/450px-General_Vicente_Guerrero.jpg" alt="Vicente Guerrero">
                    </div>
                    <div class="name">VICENTE GUERRERO</div>
                </div>

                <!-- 6. Agustín de Iturbide -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Agust%C3%ADn_de_Iturbide_c_1865.jpg/450px-Agust%C3%ADn_de_Iturbide_c_1865.jpg" alt="Agustín de Iturbide">
                    </div>
                    <div class="name">AGUSTIN DE ITURBIDE</div>
                </div>

                <!-- 7. Emiliano Zapata -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Emiliano_Zapata_1914.jpg/450px-Emiliano_Zapata_1914.jpg" alt="Emiliano Zapata">
                    </div>
                    <div class="name">EMILIANO ZAPATA</div>
                </div>

                <!-- 8. Francisco I. Madero -->
                <div class="card">
                    <div class="img-box">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Francisco_I_Madero.jpg/450px-Francisco_I_Madero.jpg" alt="Francisco I. Madero">
                    </div>
                    <div class="name">FRANCISCO I. MADERO</div>
                </div>

            </div>
        </div>

        <!-- Barra lateral verde -->
        <div class="sidebar-green"></div>

    </div>

</body>
</html>
